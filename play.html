<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050605" />
    <title>Simulation - Overseer Console</title>
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body class="player">
    <!-- The game draws here. SDL looks the element up by this id. -->
    <div id="stage"><canvas id="canvas" width="640" height="480" tabindex="-1"></canvas></div>

    <button id="handle" type="button" hidden aria-label="Open the console menu (F9)">
      F9
      <svg viewBox="0 0 14 12" aria-hidden="true"><path d="M0 0h14v2H0zM0 5h14v2H0zM0 10h14v2H0z" /></svg>
    </button>

    <!-- Shown for as long as the game is running fast. -->
    <div id="fast" hidden role="status"></div>

    <!-- Touch play: buttons beside the picture, and a keyboard. Hidden until the page is touched. -->
    <div id="deck" hidden>
      <div class="deck-side deck-left">
        <button type="button" data-act="menu" aria-label="Console menu: pause, help, exit">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path class="lit" d="M3 5h26v5H3zM3 13.5h26v5H3zM3 22h26v5H3z" />
          </svg>
          <small>MENU</small>
        </button>
        <button type="button" data-act="keys" aria-label="Show or hide the keyboard">
          <svg viewBox="0 0 40 32" aria-hidden="true">
            <rect x="2" y="6" width="36" height="20" rx="3" />
            <path class="lit" d="M6 10h4v3H6zM12 10h4v3h-4zM18 10h4v3h-4zM24 10h4v3h-4zM30 10h4v3h-4zM6 15h4v3H6zM12 15h4v3h-4zM18 15h4v3h-4zM24 15h4v3h-4zM30 15h4v3h-4zM11 20h18v3H11z" />
          </svg>
          <small>KEYS</small>
        </button>
        <!-- Shortcuts: keys the games answer to, each a tap away. This side opens the game's screens, in the order of its own interface bar. -->
        <div class="deck-quick">
          <button type="button" data-key="KeyI" aria-label="Inventory">INV</button>
          <button type="button" data-key="Tab" aria-label="Map of this place">MAP</button>
          <button type="button" data-key="KeyC" aria-label="Character screen">CHA</button>
          <button type="button" data-key="KeyP" aria-label="Pip-Boy">PIP</button>
          <button type="button" data-key="KeyS" aria-label="Skilldex">SKILL</button>
        </div>
        <span class="deck-gap"></span>
        <button type="button" data-act="esc" aria-label="Escape key">ESC</button>
      </div>
      <div class="deck-side deck-right">
        <div class="deck-quick">
          <button type="button" data-act="fast" aria-label="Fast forward" aria-pressed="false">FAST</button>
          <button type="button" data-act="lights" hidden aria-label="Highlight what lies on the ground: on and off" aria-pressed="false">HILITE</button>
          <button type="button" data-key="Space" aria-label="End your turn in combat">TURN</button>
          <button type="button" data-key="F6" aria-label="Quick save, in slot 7">QSAVE</button>
          <button type="button" data-key="F7" data-confirm="Tap QLOAD again to load the quick save" aria-label="Quick load, from slot 7: tap twice">QLOAD</button>
        </div>
        <span class="deck-gap"></span>
        <button type="button" data-act="left" aria-label="Left mouse button: click where the pointer is">
          <svg viewBox="0 0 24 32" aria-hidden="true">
            <path class="lit" d="M12 2H9a7 7 0 0 0-7 7v4h10z" />
            <path d="M9 2h6a7 7 0 0 1 7 7v14a7 7 0 0 1-7 7H9a7 7 0 0 1-7-7V9a7 7 0 0 1 7-7zM2 13h20M12 2v11" />
          </svg>
          <small>CLICK</small>
        </button>
        <button type="button" data-act="right" aria-label="Right mouse button: switch the cursor">
          <svg viewBox="0 0 24 32" aria-hidden="true">
            <path class="lit" d="M12 2h3a7 7 0 0 1 7 7v4H12z" />
            <path d="M9 2h6a7 7 0 0 1 7 7v14a7 7 0 0 1-7 7H9a7 7 0 0 1-7-7V9a7 7 0 0 1 7-7zM2 13h20M12 2v11" />
          </svg>
          <small>CURSOR</small>
        </button>
      </div>
    </div>
    <div id="keys" hidden aria-label="Keyboard"></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <!-- Boot log, the start gate, the pause menu and error reports. -->
    <div id="terminal" class="tube crt-on">
      <div class="refresh"></div>
      <main class="screen">
        <div class="bar"><span id="bar-title">OVERSEER CONSOLE</span><span id="bar-state">STANDBY</span></div>
        <div class="body" id="terminal-body" tabindex="-1"></div>
        <div class="hints" id="terminal-hints"></div>
      </main>
    </div>

    <script type="module" src="/src/player/main.ts"></script>
  </body>
</html>
