<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050605" />
    <title>Van Buren - Overseer Console</title>
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
  </head>
  <body class="player webgl">
    <!-- The tech demo draws here with WebGL 2. SDL looks the element up by this id. -->
    <div id="stage"><canvas id="canvas" tabindex="-1"></canvas></div>

    <button id="handle" type="button" hidden aria-label="Open the console menu (F9)">
      F9
      <svg viewBox="0 0 14 12" aria-hidden="true"><path d="M0 0h14v2H0zM0 5h14v2H0zM0 10h14v2H0z" /></svg>
    </button>
    <div id="toast" role="status" aria-live="polite"></div>

    <!-- Boot log, the start gate, the pause menu and error reports. -->
    <div id="terminal" class="tube crt-on">
      <div class="refresh"></div>
      <main class="screen">
        <div class="bar"><span id="bar-title">OVERSEER CONSOLE // PROTOTYPE</span><span id="bar-state">STANDBY</span></div>
        <div class="body" id="terminal-body" tabindex="-1"></div>
        <div class="hints" id="terminal-hints"></div>
      </main>
    </div>

    <script type="module" src="/src/player/vanburen.ts"></script>
  </body>
</html>
